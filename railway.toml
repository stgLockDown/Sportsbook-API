# Railway deployment configuration
# Region set to us-east4 (Virginia, US) so US-only sportsbooks (DraftKings, FanDuel,
# BetRivers, ESPN, ActionNetwork, PointsBet, Underdog, Kalshi) become reachable.
# Previously deployed from outside the US these sportsbooks were geo-blocked.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python main.py"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
numReplicas = 1

# US region — unlocks all US sportsbook scrapers.
# Valid Railway regions: us-east4, us-west1, us-west2, europe-west4, asia-southeast1
